name: Refresh Ofox Public Model Prices
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_ofox_public_catalog.py'
      - '.github/workflows/refresh-ofox-catalog.yml'
      - '.github/scripts/open-workflow-failure-issue.sh'
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh-ofox-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      # 2026-11-25 schedule: the catalog fetch succeeded, then git push was rejected
      # with a GitHub internal error. Retry the fetch and the push. Restore the
      # previous snapshot after a failed attempt so a partial file is never committed.
      - name: Refresh public catalog; retry transient failures
        run: |
          set -euo pipefail
          restore() {
            git checkout -- ofox-public-prices.json
            rm -f ofox-public-prices.json.tmp
          }
          delay=15
          for attempt in 1 2 3; do
            if python3 scripts/refresh_ofox_public_catalog.py && python3 -m json.tool ofox-public-prices.json > /dev/null; then
              exit 0
            fi
            echo "Catalog attempt ${attempt} failed. Restoring the previous snapshot."
            restore
            if [ "$attempt" -eq 3 ]; then
              echo "Catalog refresh failed after 3 attempts."
              exit 1
            fi
            echo "Retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 3))
          done
      - name: Validate JSON
        run: python3 -m json.tool ofox-public-prices.json > /dev/null
      - name: Commit fresh data only
        run: |
          set -euo pipefail
          python3 -m json.tool ofox-public-prices.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofox-public-prices.json
          if git diff --cached --quiet; then
            echo "No catalog change"
          else
            git commit -m "data: update Ofox observed public model prices"
            delay=15
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 3 ]; then
                echo "git push failed after 3 attempts. Remote main was not updated."
                exit 1
              fi
              echo "Publish attempt ${attempt} failed. Retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 3))
            done
          fi
      - name: Open or update a workflow-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: bash .github/scripts/open-workflow-failure-issue.sh
