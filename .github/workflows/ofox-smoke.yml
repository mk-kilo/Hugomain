name: Ofox chat completions smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: write
jobs:
  chat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Call chat completions only when OFOX_API_KEY is set
        env:
          OFOX_API_KEY: ${{ secrets.OFOX_API_KEY }}
          OFOX_CHAT_MODEL: openai/gpt-5.4
        run: |
          if [ -z "${OFOX_API_KEY}" ]; then
            echo "OFOX_API_KEY is unset. Not calling Ofox. ofox-smoke-status.json stays as committed."
            exit 0
          fi
          python3 scripts/ofox-smoke.py
      - name: Commit the status file only when the script changed it
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofox-smoke-status.json
          if git diff --cached --quiet; then
            echo "Smoke status unchanged. Nothing to commit."
          else
            git commit -m "data: record Ofox chat completion smoke status"
            git push origin HEAD:main
          fi
