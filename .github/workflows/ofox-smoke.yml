name: Ofox API Compatibility Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Test authenticated OpenAI Responses and Anthropic Messages APIs
        env:
          OFOX_API_KEY: ${{ secrets.OFOX_API_KEY }}
          OFOX_RESPONSES_MODEL: openai/gpt-5.6
          OFOX_ANTHROPIC_MODEL: anthropic/claude-sonnet-4.6
        run: python3 tests/ofox_smoke.py
      - name: Record a pass only after the smoke test exits 0
        if: success()
        env:
          OFOX_API_KEY: ${{ secrets.OFOX_API_KEY }}
          OFOX_SMOKE_PASSED: "1"
        run: python3 scripts/record_smoke_status.py
      - name: Commit status only when the recorder wrote a real pass
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofox-smoke-status.json
          if git diff --cached --quiet; then
            echo "Smoke status unchanged. Nothing to commit."
          else
            git commit -m "data: record passing Ofox API smoke test"
            git push origin HEAD:main
          fi
